name: Sync Goodreads data

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC
  workflow_dispatch: {}     # manual "Run workflow" button
  push:
    paths:
      - "data/goodreads_export*.csv"  # re-run when any backfill CSV changes
      - "config.json"                 # ...or when someone is added/changed

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sync
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/sync.py

      - name: Commit updated data
        if: always()   # keep partial author-cache progress even if sync errored
        run: |
          git config user.name "book-world-tour-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily Goodreads sync"
            git push
          fi
